[project]
name = "erp-connectors"
version = "0.1.0"
description = "A canonical-model integration layer that unifies Odoo, Microsoft Dynamics 365 Business Central, and custom-built (e.g. Next.js/NestJS) ERPs behind one interface."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Paul Nyoike" }]
dependencies = [
    "requests>=2.31",
    "msal>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
